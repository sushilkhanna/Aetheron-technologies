server.port=${PORT:8080}

# Database - local MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bikepooling}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# HikariPool
spring.datasource.hikari.pool-name=HikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# Redis - local
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT
jwt.secret=${JWT_SECRET:your-super-secret-key-should-be-at-least-32-characters-long}
jwt.expiry.ms=86400000

# OTP
otp.expiry.seconds=300

# MSG91
msg91.auth.key=${MSG91_AUTH_KEY:your-msg91-auth-key}
msg91.template.id=${MSG91_TEMPLATE_ID:your-template-id}
msg91.sender.id=${MSG91_SENDER_ID:BKPOOL}

# Firebase
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Logging
logging.level.com.bikepooling=DEBUG

# SOS Admin
sos.admin.phones=${SOS_ADMIN_PHONES:}