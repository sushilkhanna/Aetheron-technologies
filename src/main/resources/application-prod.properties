server.port=${PORT:8080}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# HikariPool
spring.datasource.hikari.pool-name=HikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiry.ms=86400000

# OTP
otp.expiry.seconds=300

# MSG91
msg91.auth.key=${MSG91_AUTH_KEY}
msg91.template.id=${MSG91_TEMPLATE_ID}
msg91.sender.id=${MSG91_SENDER_ID}

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Logging
logging.level.com.bikepooling=INFO

# Firebase
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}

# SOS
sos.tracking.base-url=${SOS_TRACKING_BASE_URL:https://bikepooling.in/sos/track}