<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="50%" stop-color="#FF7000"/>
      <stop offset="100%" stop-color="#E05600"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF7000"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#FF7000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="url(#orangeGrad)" stroke-width="4"/>
  
  <!-- Inner Glow Ring -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#orangeGrad)" stroke-width="3" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Electric Zap / Ride Sharing Icon -->
  <g filter="url(#shadow)">
    <!-- Zap Lightning Symbol -->
    <path d="M 72 20 L 36 68 H 60 L 52 108 L 92 56 H 68 Z" fill="url(#orangeGrad)" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>
