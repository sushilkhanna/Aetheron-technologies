<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Solid Black Background -->
  <rect width="512" height="512" fill="#000000"/>
  
  <g transform="translate(30, 190) scale(0.95)">
    <!-- bike text in orange -->
    <text x="0" y="90" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="110" fill="#FF7000">bike</text>
    
    <!-- Rider icon in center -->
    <g transform="translate(195, -15) scale(0.9)">
      <circle cx="45" cy="18" r="14" fill="#FF7000"/>
      <path d="M 32 36 L 54 36 L 68 75 L 30 75 Z" fill="#FF7000"/>
      <circle cx="22" cy="82" r="16" fill="none" stroke="#FF7000" stroke-width="8"/>
      <circle cx="72" cy="82" r="16" fill="none" stroke="#FF7000" stroke-width="8"/>
      <path d="M 22 82 L 72 82" stroke="#FFFFFF" stroke-width="7"/>
    </g>
    
    <!-- pooling text in white -->
    <text x="275" y="90" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="110" fill="#FFFFFF">pooling</text>
    <!-- .in text in orange -->
    <text x="440" y="90" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="55" fill="#FF7000">.in</text>
  </g>
</svg>